name: backup-catalog

services:
  db:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: backup_catalog
      POSTGRES_USER: backup_catalog
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Copy .env.example to .env and set DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backup_catalog -d backup_catalog"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  app:
    build:
      context: .
      target: development
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_DSN: pgsql:host=db;port=5432;dbname=backup_catalog
      DATABASE_USER: backup_catalog
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Copy .env.example to .env and set DATABASE_PASSWORD}
      TEST_DATABASE_DSN: pgsql:host=db;port=5432;dbname=backup_catalog
      TEST_DATABASE_USER: backup_catalog
      TEST_DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Copy .env.example to .env and set DATABASE_PASSWORD}
      MIGRATE_ON_START: "true"
      OVERDUE_RUNNING_HOURS: ${OVERDUE_RUNNING_HOURS:-4}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',9000); exit($$s ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.29.8-alpine3.23@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  backend:
    internal: true
